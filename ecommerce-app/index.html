<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
</style>

<body>
    <div class="flex justify-center items-center h-screen font-[Inter] bg-neutral-800 selection:bg-rose-900/50">
        <div id="card" class=" bg-neutral-950 size-96 rounded-sm shadow-xl border border-2 border-neutral-800/20 ">


            <div class="h-1/2 px-6 pt-4 pb-2 ">
                <h1 class="text-white">Products:</h1>
                <div class="h-90/100 overflow-auto scrollbar-thumb-indigo-500 scrollbar-track-neutral-950 scrollbar-thin text-[16px] *:my-2 "
                    id="product-container">
                    <!-- <div class="flex justify-between bg-neutral-100/10 px-2 py-1 rounded-sm">
                        <h2 class="text-white">Product 1</h2>
                        <button class="text-white bg-indigo-700 rounded-sm px-2 cursor-pointer">Add to Cart</button>
                    </div> -->
                </div>
            </div>
            <div id="cartContainer" class="h-1/2 px-6 py-2  ">
                <h1 class="text-white">Cart:</h1>
                <div class="border border-2 border-white/30 rounded-sm h-85/100 *:my-2 *:mx-2 overflow-auto scrollbar-thumb-indigo-500 scrollbar-track-neutral-950 scrollbar-thin"
                    id="product-cart">
                    <!-- <p class="text-white text-[16px] bg-neutral-100/10 px-2 py-1 rounded-sm">Product 1</p> -->
                </div>

            </div>
            <div class="flex justify-between text-[16px] text-white py-2">
                <p>Total:<span id="total"></span></p>
                <button
                    id="buy"
                    class="bg-neutral-200/20 rounded-sm px-2 cursor-pointer hover:bg-neutral-200/30 transition duration-100">Buy
                    Now</button>
            </div>
        </div>

    </div>
</body>
<script src="app.js"></script>

</html>
