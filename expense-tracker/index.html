  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

    .fade-out {
      opacity: 0;
      /* transform: translateX(50px); */
      transition: opacity 0.2s ease;
    }

  <body>
    <div
      class="font-[Inter] flex justify-center items-center bg-neutral-950/90 h-screen selection:bg-rose-700"
    >
      <div class="bg-neutral-950/70 size-96 rounded-md shadow-lg px-10 py-4">
        <div class="flex flex-col *:my-[8px] items-center h-1/2">

            class="text-white/90 text-[20px] text-center font-medium tracking-tight"
          >
            Add Expense
          </h1>
          <input
            type="text"
            id="expense-name"
            class="w-3/4 text-[16px] bg-neutral-900/90 rounded-sm px-2 py-1 text-white/90 placeholder:text-white/70 font-light placeholder:tracking-wide outline outline-2 outline-neutral-800"
            placeholder="Expense name"
          />
          <input
            type="text"
            id="expense-amount"
            class="w-3/4 text-[16px] bg-neutral-900/90 rounded-sm px-2 py-1 text-white/90 placeholder:text-white/70 font-light placeholder:tracking-wide outline outline-2 outline-neutral-800"
            placeholder="Amount"
          />
          <button
            id="add-expense-button"
            class="bg-neutral-800/40 text-white/75 text-[16px] border-1 border-white/40 px-2 rounded-sm cursor-pointer hover:bg-neutral-800/70 transition duration-100 tracking-normal font-light"
          >
            Add Expense
          </button>
        </div>
        <h1 class="text-white/90 text-[18px] font-light tracking-wide">
          Expenses:
        </h1>
