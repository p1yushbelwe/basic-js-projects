<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="font-mono flex justify-center text-[16px] items-center rounded-sm shadow-lg h-screen bg-neutral-800">
        <div class="box size-96 bg-neutral-900 py-10 px-16">
            <div class="flex justify-between">
                <input id="task-input" type="text" placeholder="Add a new task!" class="outline-none text-black placeholder:text-black/80 bg-neutral-300 px-2 py-1 rounded-sm w-48 mb-1">
                <button id="add-task" class="cursor-pointer text-black/80 bg-neutral-300 px-4 py-1 rounded-sm hover:bg-neutral-300/95 hover:text-black mb-1 shadow-lg">Add</button>
            </div>

            <div id="all-tasks" class="h-9/10 overflow-auto scrollbar-thin scrollbar-thumb-neutral-700">
                <!-- <li class="flex justify-between text-white/85 bg-neutral-800 px-2 py-1 list-none my-2 rounded-sm">
                    <span>Hello</span>
                    <button class="bg-rose-700 py-1/2 px-1 rounded-xs">delete</button>
                </li> -->
            </div>
        </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
